# Пороги RAM-сторожа v3. Всё в KB MemAvailable. Файл читается КАЖДЫМ тиком,
# правка применяется без перезапуска демона.
# Машина: WSL 6 GB (.wslconfig memory=6GB), своп 2 GB, swappiness низкий.

SOFT_KB=1400000      # ниже -> заморозка codex/omx + снапшоты топ-потребителей
CRIT_KB=800000       # ниже -> пауза batch-агентов claude (обратимо, <=MAX_PAUSE)
EMERG_KB=450000      # ниже -> убийство дерева-жертвы по приоритету
RESUME_KB=1800000    # выше -> снять все паузы (гистерезис)

INTERVAL=10          # период тика, сек
MAX_PAUSE=180        # предел паузы агента (stall-killer супервизора)

MIN_KILL_KB=120000       # минимальный вес дерева, чтобы его вообще убивать
MIN_KILL_TTY_KB=350000   # порог для ИНТЕРАКТИВНОЙ claude-сессии (последняя очередь)
PSI_THRASH=25            # /proc/pressure/memory some avg10 выше -> эскалация на ступень

TG_CHAT=YOUR_TELEGRAM_CHAT_ID
TG_MIN_GAP=300           # не чаще одного сообщения на уровень в 5 минут

HARD_SANITY_KB=2000000   # абсолютный предохранитель: выше этого свободной памяти kill НЕ делается
